<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar</title>
</head>
<style>
    nav{
        position: fixed;
        background-color: black;
        width: 100%;
        padding: 10px 0;
        z-index: 12;
    }
    nav .menu{
        max-width: 1250px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
    }
    .menu .logo a{
        text-decoration: none;
        color: white;
        font-size: 40px;
        font-weight:600;
    }
    .menu ul{
        display:inline-flex;
    }
    .menu ul li{
        list-style: none;
        margin-left:7px ;
    }
    .menu ul li:first-child{
        margin-left: 0px;
    }
    .menu ul li a {
        text-decoration: none;
        color: white;
        font-size: 18px;
        font-weight: 500;
        padding: 8px 25px;
        border-radius: 7px;
        transition: all 0.3s ease;
    }
    .menu ul li a:hover {
  background: #fff;
  color: black;
}
</style>
<body>
    <nav>
        <div class="menu">
            <div class="logo">
            <a href="#">Aspirians 26-6-24</a>
        </div>
        <div>
            <ul>
                <li><a target="_blank" href="https://www.youtube.com">Youtube</a></li>
                <li><a target="_blank" href="https://www.Chrome.com">Chrome</a></li>
                <li><a target="_blank" href="https://www.facebook.com">Facebook</a></li>
                <li><a target="_blank" href="https://www.instagram.com">Instagram</a></li>

            </ul>
        </div>
    </nav>
</body>
</html>
